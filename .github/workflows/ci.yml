name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint, type-check, test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy (strict on core + catalog)
        run: mypy src/iphone_archive/core src/iphone_archive/catalog

      - name: Pytest with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=iphone_archive --cov-report=term-missing --cov-fail-under=85
