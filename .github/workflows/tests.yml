name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: python -m ruff check --output-format=github .

      - name: Ruff (format check)
        run: python -m ruff format --check .

      - name: Mypy (strict on core + catalog)
        run: python -m mypy --strict src/iphone_archive/core src/iphone_archive/catalog

  test:
    name: Unit tests (Python ${{ matrix.python-version }}, Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest
          --cov=iphone_archive
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85
          --junitxml=test-results.xml

      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        shell: pwsh
        run: |
          [xml]$cov = Get-Content coverage.xml
          $pct = [math]::Round([double]$cov.coverage.'line-rate' * 100, 1)
          "### Coverage (Python ${{ matrix.python-version }}): $pct%" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore
