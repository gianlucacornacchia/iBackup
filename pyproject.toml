[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-archive"
version = "0.1.0"
description = "Permanent, append-only archive of photos and videos from a USB-connected iPhone (Windows-first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gcornacchia", email = "gianluca.cornacchia@electrolux.com" }]
keywords = ["iphone", "backup", "archive", "photos", "afc", "pymobiledevice3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]

dependencies = [
    "typer>=0.12",
    "pymobiledevice3>=4.0",
    "PySide6>=6.6",
    "pillow-heif>=0.16",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyinstaller>=6.0",
]

[project.scripts]
ibackup = "iphone_archive.cli:main"
ibackup-gui = "iphone_archive.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["iphone_archive.core.*", "iphone_archive.catalog.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["pymobiledevice3.*", "pillow_heif.*", "PIL.*", "PySide6.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["iphone_archive"]
branch = true
